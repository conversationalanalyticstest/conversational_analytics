name: pr-checks

# Contrato: specs/005-pr-checks-semantic-isolation/contracts/pr-candidate-workflow.md
# Valida una PR contra main ejecutando la suite completa contra una copia efimera y aislada de
# la semantic view ("candidata", SV_PHARMA_SALES_PR<numero>), nunca contra la de produccion
# (ver decisions/001-aislar-semantic-view-candidata-en-pr.md). El check "pr-checks" es el
# required status check de la proteccion de rama (FR-002, FR-003) — se configura a mano
# (tasks.md T003 de la feature 004-ci-cd-pipeline).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  CORTEX_MODEL: ${{ secrets.CORTEX_MODEL }}
  SNOWFLAKE_SEMANTIC_VIEW: CICD_DEMO.DATA.SV_PHARMA_SALES_PR${{ github.event.pull_request.number }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build candidate semantic view
        if: github.event.action != 'closed'
        run: poetry run python -m conversational_analytics.ops.pr_candidate build --pr-number ${{ github.event.pull_request.number }}

      - name: Run test suite
        if: github.event.action != 'closed'
        run: poetry run pytest

      - name: Drop candidate semantic view
        if: always()
        run: poetry run python -m conversational_analytics.ops.pr_candidate drop --pr-number ${{ github.event.pull_request.number }}
